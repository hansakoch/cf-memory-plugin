[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-memory-plugin"
version = "0.1.0"
description = "Cloudflare Agent Memory plugin for AI coding agents and LLM frameworks. Gives any agent persistent cross-session memory via Cloudflare's managed recall, ingest, and summary API. Works as an MCP server, Hermes provider, A2A agent, or standalone Python client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Hans Koch", email = "hans@icebergmedia.co.uk"},
]
keywords = ["cloudflare", "agent-memory", "mcp", "hermes", "ai", "memory", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
hermes = []
a2a = ["starlette>=0.27", "uvicorn>=0.31"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.urls]
Homepage = "https://github.com/hansakoch/cloudflare-memory"
Documentation = "https://cloudflare-memory.pages.dev"
Repository = "https://github.com/hansakoch/cloudflare-memory"
Issues = "https://github.com/hansakoch/cloudflare-memory/issues"

[project.scripts]
cf-memory = "cloudflare_memory.main:main"

[project.entry-points."hermes_agent.memory_providers"]
cloudflare-memory = "cloudflare_memory:register"
