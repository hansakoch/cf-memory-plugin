[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudflare-memory"
version = "0.1.0"
description = "Cloudflare Agent Memory client, MCP server, and Hermes provider"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
hermes = []  # Hermes loads via plugin entry point, no extra deps
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
cloudflare-memory = "cloudflare_memory.main:main"

[project.entry-points."hermes_agent.memory_providers"]
cloudflare-memory = "cloudflare_memory:register"
